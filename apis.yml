    name: JobNimbus Open API
    description: >-
      REST-like API for managing contacts, jobs, tasks, files, and workflow
      automation in JobNimbus. Supports GET, PUT, and POST methods with JSON
      payloads. Authentication uses an API key generated from the JobNimbus
      account settings.
    humanURL: https://documenter.getpostman.com/view/3919598/S11PpG4x
