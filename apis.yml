aid: jobnimbus
name: JobNimbus
description: >-
  JobNimbus is a CRM and project management platform built for contractors,
  particularly in roofing, restoration, and home services industries. The
  platform enables lead tracking, job scheduling, estimating, invoicing,
  document management, and workflow automation. JobNimbus exposes a REST-like
  Open API supporting GET, PUT, and POST requests with JSON payloads,
  authenticated via API keys generated from the user dashboard.
type: Index
